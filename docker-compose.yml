version: '3.8'

services:
  # ===================== DJANGO MONOLITH =====================
  django_web:
    build: .
    container_name: habite_django
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn habite_project.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60"
    volumes:
      - .:/app
      - media_files:/app/media
      - static_files:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================== FLASK MICROSERVICE (NEW) =====================
  flask_payment:
    build: ./flask_payment_service
    container_name: habite_payment_service
    command: >
      sh -c "gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 60 app:app"
    volumes:
      - ./flask_payment_service:/app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - MICROSERVICE_NAME=Payment & Invoice Service
      - DJANGO_URL=http://django_web:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      - django_web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================== NGINX REVERSE PROXY (NEW) =====================
  nginx:
    image: nginx:latest
    container_name: habite_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - media_files:/app/media:ro
      - static_files:/app/staticfiles:ro
    depends_on:
      - django_web
      - flask_payment
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3


volumes:
  media_files:
  static_files:

networks:
  default:
    name: habite_network
