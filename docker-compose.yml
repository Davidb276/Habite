services:
  # ===================== FLASK CORE BUSINESS SERVICE =====================
  flask_core:
    build: ./flask_core_service
    container_name: habite_core_service
    command: >
      sh -c "gunicorn --bind 0.0.0.0:5001 --workers 2 --timeout 60 app:app"
    volumes:
      - ./flask_core_service:/app
      - .:/workspace
      - ./db.sqlite3:/workspace/db.sqlite3
      - ./media:/workspace/media
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - MICROSERVICE_NAME=Core Business Service
      - DJANGO_PROJECT_ROOT=/workspace
      - HABITE_PAYMENT_SERVICE_URL=http://flask_payment:5000
      - PYTHONUNBUFFERED=1
    depends_on:
      - django_web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================== DJANGO MONOLITH =====================
  django_web:
    build: .
    container_name: habite_django
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn habite_project.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60"
    volumes:
      - .:/app
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - PYTHONUNBUFFERED=1
      - HABITE_CORE_SERVICE_URL=http://flask_core:5001
      - HABITE_PAYMENT_SERVICE_URL=http://flask_payment:5000
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================== FLASK MICROSERVICE (NEW) =====================
  flask_payment:
    build: ./flask_payment_service
    container_name: habite_payment_service
    command: >
      sh -c "gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 60 app:app"
    volumes:
      - ./flask_payment_service:/app
      - .:/workspace
      - ./db.sqlite3:/workspace/db.sqlite3
      - ./media:/workspace/media
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - MICROSERVICE_NAME=Payment & Invoice Service
      - DJANGO_URL=http://django_web:8000
      - DJANGO_PROJECT_ROOT=/workspace
      - PYTHONUNBUFFERED=1
    depends_on:
      - django_web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================== REDIS MESSAGE BROKER =====================
  redis:
    image: redis:7-alpine
    container_name: habite_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================== CELERY WORKER =====================
  celery_worker:
    build: .
    container_name: habite_celery_worker
    entrypoint: []
    command: >
      sh -c "celery -A habite_project worker -l info"
    volumes:
      - .:/app
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    environment:
      - DEBUG=True
      - PYTHONUNBUFFERED=1
      - HABITE_CORE_SERVICE_URL=http://flask_core:5001
      - HABITE_PAYMENT_SERVICE_URL=http://flask_payment:5000
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
      - django_web
    healthcheck:
      test: ["CMD-SHELL", "celery -A habite_project inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================== NGINX REVERSE PROXY (NEW) =====================
  nginx:
    image: nginx:latest
    container_name: habite_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./media:/app/media:ro
      - ./staticfiles:/app/staticfiles:ro
    depends_on:
      - django_web
      - flask_core
      - flask_payment
      - redis
      - celery_worker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3


networks:
  default:
    name: habite_network
