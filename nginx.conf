# Nginx Configuration for Habité (Strangler Pattern)
# Routes traffic between Django Monolith and Flask Microservice

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # ===================== UPSTREAM SERVERS =====================
    
    # Django Monolith (Legacy)
    upstream django_backend {
        server django_web:8000 max_fails=3 fail_timeout=30s;
    }

    # Flask Microservice (New Payment Service)
    upstream flask_payment_service {
        server flask_payment:5000 max_fails=3 fail_timeout=30s;
    }

    # ===================== MAIN SERVER =====================
    
    server {
        listen 80;
        server_name _;

        # ===== HEALTH CHECK ENDPOINT =====
        location /health {
            access_log off;
            return 200 '{"status": "ok", "service": "Nginx Router"}';
            add_header Content-Type application/json;
        }

        # ===== STRANGLER PATTERN ROUTES =====
        # NEW: Payment & Invoice Microservice
        location /api/v2/facturas/ {
            proxy_pass http://flask_payment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Timeouts for PDF generation (puede tardar)
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Logging
            access_log /var/log/nginx/flask_payment.log main;
            
            # Error handling
            proxy_intercept_errors on;
            error_page 502 503 504 =503 @service_unavailable;
        }

        location /api/v2/pagos/ {
            proxy_pass http://flask_payment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            access_log /var/log/nginx/flask_payment.log main;
            proxy_intercept_errors on;
            error_page 502 503 504 =503 @service_unavailable;
        }

        location /api/v2/notificaciones/ {
            proxy_pass http://flask_payment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            access_log /var/log/nginx/flask_payment.log main;
            proxy_intercept_errors on;
            error_page 502 503 504 =503 @service_unavailable;
        }

        # ===== STATIC & MEDIA FILES =====
        # Serve media files directly from the shared volume
        location /media/ {
            alias /app/media/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Serve static files directly from the shared volume
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ===== DEFAULT ROUTES =====
        # Legacy Django endpoints (older API versions, web pages, etc.)
        location / {
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Standard timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            access_log /var/log/nginx/django_monolith.log main;
            proxy_intercept_errors on;
            error_page 502 503 504 =503 @service_unavailable;
        }

        # ===== ERROR HANDLERS =====
        location @service_unavailable {
            default_type application/json;
            return 503 '{"error": true, "mensaje": "Servicio no disponible. Intente más tarde."}';
        }
    }
}
